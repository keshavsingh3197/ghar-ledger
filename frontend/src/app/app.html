<div class="app-shell">
  <header class="app-header">
    <a class="brand" routerLink="/">{{ icon(keys.iconHome, '🏠') }} Ghar Ledger</a>
    @if (auth.isAuthenticated()) {
      <div class="user-chip">
        <span class="user-name">{{ auth.user()?.displayName }}</span>
        <a class="chip-btn" routerLink="/settings" title="Profile and settings" aria-label="Profile and settings">⚙</a>
        <button class="chip-btn" type="button" (click)="logout()" title="Sign out">⏻</button>
      </div>
    }
  </header>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
