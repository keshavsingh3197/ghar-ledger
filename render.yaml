services:
  - type: web
    name: ghar-ledger-api
    # Builds from backend/Dockerfile (a Docker web service on Render).
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Mongo__ConnectionString
        sync: false
      - key: Mongo__Database
        value: GharLedgerDb
      - key: AllowedOrigins__0
        value: https://ghar.keshavsingh.in
      - key: AllowedOrigins__1
        value: https://keshavsingh3197.github.io
      # ---- Shared SSO secret (runtime) — MUST be the exact same value as admin's Jwt__SigningKey,
      # set in the Render dashboard, never in git. A token minted by admin only validates here if
      # this key matches. ----
      - key: Jwt__SigningKey
        sync: false
    healthCheckPath: /health
    # NOTE: PACKAGES_READ_TOKEN is a *build* secret, not a runtime env var. Docker builds can't
    # read env vars, so add it in the Render dashboard as a SECRET FILE named PACKAGES_READ_TOKEN
    # (contents = a read:packages classic PAT). The Dockerfile mounts it.
